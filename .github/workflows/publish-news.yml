name: Publish scheduled OSDA news

on:
  # GitHub Actions uses UTC. 05:00 UTC is 06:00 in Lagos, leaving time for
  # article preparation and the automatic Vercel deployment before 07:00 WAT.
  schedule:
    - cron: "0 5 * * 0,1,3,5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scheduled-osda-news
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the live branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install project dependencies
        run: npm ci

      - name: Prepare this edition’s four original full stories
        run: npm run news:publish
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4o-mini

      - name: Verify the updated site builds
        run: npm run build

      - name: Save the new edition in the website archive
        id: save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/news.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new issue was added."
          else
            git commit -m "Publish OSDA news issue $(date -u +%F)"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Vercel deployment hook when configured
        if: steps.save.outputs.changed == 'true'
        run: |
          if [ -n "$VERCEL_DEPLOY_HOOK_URL" ]; then
            curl --fail --silent --show-error --request POST "$VERCEL_DEPLOY_HOOK_URL"
          else
            echo "No deploy hook configured; relying on the connected Vercel Git integration."
          fi
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
